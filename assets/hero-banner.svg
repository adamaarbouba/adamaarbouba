<svg xmlns="http://www.w3.org/2000/svg" width="800" height="150" viewBox="0 0 800 150" role="img" aria-label="Adam Aarbouba – Full Stack &amp; AI Developer">
  <title>Adam Aarbouba – Full Stack &amp; AI Developer</title>

  <defs>

    <!-- Gradient spanning the full block row (64 → 736) -->
    <linearGradient id="g" x1="64" y1="0" x2="736" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#FF2D78"/>
      <stop offset="50%"  stop-color="#9D4EDD"/>
      <stop offset="100%" stop-color="#00F5FF"/>
    </linearGradient>

    <!-- Gradient for the name text -->
    <linearGradient id="tg" x1="160" y1="0" x2="640" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#FF2D78"/>
      <stop offset="50%"  stop-color="#9D4EDD"/>
      <stop offset="100%" stop-color="#00F5FF"/>
    </linearGradient>

    <!-- Glow filter (GitHub keeps feGaussianBlur + feMerge) -->
    <filter id="glow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Text glow -->
    <filter id="tglow" x="-10%" y="-60%" width="120%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Clip scanner to the bar zone -->
    <clipPath id="clip">
      <rect x="64" y="27" width="672" height="20"/>
    </clipPath>

  </defs>

  <!-- ══════════════════════════════════════════
       BLOCKS  —  26 × (w22 h18 rx2 step26)
       x = 64 + i*26
       SMIL animate on opacity, stagger 0.09s
       ══════════════════════════════════════════ -->
  <g filter="url(#glow)">

    <!-- Dissolve-fade LEFT edge -->
    <rect x="64"  y="28" width="22" height="18" rx="2" fill="url(#g)" opacity="0.05">
      <animate attributeName="opacity" values="0.05;0.9;0.05" dur="2.4s" begin="0.00s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/>
    </rect>
    <rect x="90"  y="28" width="22" height="18" rx="2" fill="url(#g)" opacity="0.10">
      <animate attributeName="opacity" values="0.10;0.95;0.10" dur="2.4s" begin="0.09s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/>
    </rect>
    <rect x="116" y="28" width="22" height="18" rx="2" fill="url(#g)" opacity="0.18">
      <animate attributeName="opacity" values="0.18;1;0.18" dur="2.4s" begin="0.18s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/>
    </rect>
    <rect x="142" y="28" width="22" height="18" rx="2" fill="url(#g)" opacity="0.28">
      <animate attributeName="opacity" values="0.28;1;0.28" dur="2.4s" begin="0.27s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/>
    </rect>
    <rect x="168" y="28" width="22" height="18" rx="2" fill="url(#g)" opacity="0.40">
      <animate attributeName="opacity" values="0.40;1;0.40" dur="2.4s" begin="0.36s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/>
    </rect>
    <rect x="194" y="28" width="22" height="18" rx="2" fill="url(#g)" opacity="0.55">
      <animate attributeName="opacity" values="0.55;1;0.55" dur="2.4s" begin="0.45s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/>
    </rect>
    <rect x="220" y="28" width="22" height="18" rx="2" fill="url(#g)" opacity="0.70">
      <animate attributeName="opacity" values="0.70;1;0.70" dur="2.4s" begin="0.54s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/>
    </rect>
    <rect x="246" y="28" width="22" height="18" rx="2" fill="url(#g)" opacity="0.82">
      <animate attributeName="opacity" values="0.82;1;0.82" dur="2.4s" begin="0.63s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/>
    </rect>

    <!-- Solid CENTER blocks — breathe between 0.60 and 1 -->
    <rect x="272" y="28" width="22" height="18" rx="2" fill="url(#g)" opacity="1">
      <animate attributeName="opacity" values="0.60;1;0.60" dur="2.4s" begin="0.72s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/>
    </rect>
    <rect x="298" y="28" width="22" height="18" rx="2" fill="url(#g)" opacity="1">
      <animate attributeName="opacity" values="0.60;1;0.60" dur="2.4s" begin="0.81s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/>
    </rect>
    <rect x="324" y="28" width="22" height="18" rx="2" fill="url(#g)" opacity="1">
      <animate attributeName="opacity" values="0.60;1;0.60" dur="2.4s" begin="0.90s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/>
    </rect>
    <rect x="350" y="28" width="22" height="18" rx="2" fill="url(#g)" opacity="1">
      <animate attributeName="opacity" values="0.60;1;0.60" dur="2.4s" begin="0.99s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/>
    </rect>
    <rect x="376" y="28" width="22" height="18" rx="2" fill="url(#g)" opacity="1">
      <animate attributeName="opacity" values="0.60;1;0.60" dur="2.4s" begin="1.08s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/>
    </rect>
    <rect x="402" y="28" width="22" height="18" rx="2" fill="url(#g)" opacity="1">
      <animate attributeName="opacity" values="0.60;1;0.60" dur="2.4s" begin="1.17s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/>
    </rect>
    <rect x="428" y="28" width="22" height="18" rx="2" fill="url(#g)" opacity="1">
      <animate attributeName="opacity" values="0.60;1;0.60" dur="2.4s" begin="1.26s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/>
    </rect>
    <rect x="454" y="28" width="22" height="18" rx="2" fill="url(#g)" opacity="1">
      <animate attributeName="opacity" values="0.60;1;0.60" dur="2.4s" begin="1.35s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/>
    </rect>
    <rect x="480" y="28" width="22" height="18" rx="2" fill="url(#g)" opacity="1">
      <animate attributeName="opacity" values="0.60;1;0.60" dur="2.4s" begin="1.44s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/>
    </rect>
    <rect x="506" y="28" width="22" height="18" rx="2" fill="url(#g)" opacity="1">
      <animate attributeName="opacity" values="0.60;1;0.60" dur="2.4s" begin="1.53s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/>
    </rect>
    <rect x="532" y="28" width="22" height="18" rx="2" fill="url(#g)" opacity="1">
      <animate attributeName="opacity" values="0.60;1;0.60" dur="2.4s" begin="1.62s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/>
    </rect>
    <rect x="558" y="28" width="22" height="18" rx="2" fill="url(#g)" opacity="1">
      <animate attributeName="opacity" values="0.60;1;0.60" dur="2.4s" begin="1.71s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/>
    </rect>
    <rect x="584" y="28" width="22" height="18" rx="2" fill="url(#g)" opacity="1">
      <animate attributeName="opacity" values="0.60;1;0.60" dur="2.4s" begin="1.80s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/>
    </rect>
    <rect x="610" y="28" width="22" height="18" rx="2" fill="url(#g)" opacity="1">
      <animate attributeName="opacity" values="0.60;1;0.60" dur="2.4s" begin="1.89s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/>
    </rect>

    <!-- Dissolve-fade RIGHT edge -->
    <rect x="636" y="28" width="22" height="18" rx="2" fill="url(#g)" opacity="0.82">
      <animate attributeName="opacity" values="0.82;1;0.82" dur="2.4s" begin="1.98s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/>
    </rect>
    <rect x="662" y="28" width="22" height="18" rx="2" fill="url(#g)" opacity="0.70">
      <animate attributeName="opacity" values="0.70;1;0.70" dur="2.4s" begin="2.07s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/>
    </rect>
    <rect x="688" y="28" width="22" height="18" rx="2" fill="url(#g)" opacity="0.55">
      <animate attributeName="opacity" values="0.55;1;0.55" dur="2.4s" begin="2.16s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/>
    </rect>
    <rect x="714" y="28" width="22" height="18" rx="2" fill="url(#g)" opacity="0.28">
      <animate attributeName="opacity" values="0.28;0.9;0.28" dur="2.4s" begin="2.25s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/>
    </rect>

  </g>

  <!-- ══════════════════════════════════════════
       SCANNER SWEEP — white sliver, clipped
       ══════════════════════════════════════════ -->
  <g clip-path="url(#clip)">
    <rect x="42" y="27" width="24" height="20" rx="2" fill="white" opacity="0">
      <!-- fade in fast -->
      <animate attributeName="opacity" values="0;0.22;0" dur="2.4s" begin="0s" repeatCount="indefinite" keyTimes="0;0.08;0.92" calcMode="spline" keySplines="0 0 1 1;0 0 1 1"/>
      <!-- slide left → right across bar -->
      <animateTransform attributeName="transform" type="translate"
        from="22 0" to="718 0"
        dur="2.4s" begin="0s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- ══════════════════════════════════════════
       TYPOGRAPHY
       font-family falls back to system monospace
       — no @import needed, works on GitHub
       ══════════════════════════════════════════ -->

  <!-- Name: gradient fill, glow filter, fade-in -->
  <text
    x="400" y="96"
    text-anchor="middle"
    font-family="'Courier New', 'Lucida Console', monospace"
    font-size="27"
    font-weight="bold"
    letter-spacing="5"
    fill="url(#tg)"
    filter="url(#tglow)"
    opacity="0"
  >ADAM AARBOUBA
    <animate attributeName="opacity" values="0;1" dur="1s" begin="0.4s" fill="freeze" repeatCount="1"/>
  </text>

  <!-- Role: violet, letter-spaced, fade-in then gentle pulse -->
  <text
    x="400" y="121"
    text-anchor="middle"
    font-family="'Courier New', 'Lucida Console', monospace"
    font-size="11"
    letter-spacing="7"
    fill="#9D4EDD"
    opacity="0"
  >FULL STACK &amp; AI DEVELOPER
    <!-- fade in -->
    <animate attributeName="opacity" values="0;0.85" dur="1s" begin="0.9s" fill="freeze" repeatCount="1"/>
    <!-- then breathe between violet and cyan -->
    <animate attributeName="fill" values="#9D4EDD;#00F5FF;#9D4EDD" dur="3s" begin="2s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/>
    <animate attributeName="opacity" values="0.85;1;0.85" dur="3s" begin="2s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/>
  </text>

</svg>
