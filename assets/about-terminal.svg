<svg xmlns="http://www.w3.org/2000/svg" width="780" height="220" viewBox="0 0 780 220" role="img" aria-label="Terminal: Adam Aarbouba profile">
  <title>profile.adam — bash</title>

  <defs>
    <!-- Crimson glow for title bar underline -->
    <filter id="btnglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Subtle text glow -->
    <filter id="tglow" x="-5%" y="-40%" width="110%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Prompt glow -->
    <filter id="pglow" x="-5%" y="-60%" width="110%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ── OUTER SHELL ─────────────────────────────── -->
  <!-- Subtle crimson border -->
  <rect x="0.5" y="0.5" width="779" height="219" rx="10" ry="10"
        fill="none" stroke="#A4133C" stroke-width="1" opacity="0.35"/>

  <!-- ── TITLE BAR ───────────────────────────────── -->
  <rect x="1" y="1" width="778" height="36" rx="10" ry="10" fill="#2A0A14"/>
  <!-- Square off bottom corners of title bar -->
  <rect x="1" y="20" width="778" height="17" fill="#2A0A14"/>
  <!-- Hairline separator -->
  <line x1="1" y1="37" x2="779" y2="37" stroke="#A4133C" stroke-width="0.5" opacity="0.4"/>

  <!-- Window buttons — all crimson, three depths -->
  <!-- Darkest: #4D0018 -->
  <circle cx="24" cy="18" r="6" fill="#4D0018" filter="url(#btnglow)"/>
  <!-- Mid: #A4133C -->
  <circle cx="46" cy="18" r="6" fill="#A4133C" filter="url(#btnglow)"/>
  <!-- Brightest: #FF4D6D -->
  <circle cx="68" cy="18" r="6" fill="#FF4D6D" filter="url(#btnglow)">
    <animate attributeName="opacity" values="1;0.55;1" dur="3s" begin="2.6s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/>
  </circle>

  <!-- Title bar label -->
  <text x="390" y="22" text-anchor="middle" dominant-baseline="middle"
        font-family="'Courier New', monospace" font-size="11" fill="#C9184A" opacity="0.8"
        letter-spacing="1">profile.adam — bash</text>

  <!-- ── TERMINAL BODY ───────────────────────────── -->
  <rect x="1" y="37" width="778" height="182" rx="0" ry="0" fill="#0F0F0F"/>
  <!-- Round bottom corners -->
  <rect x="1" y="200" width="778" height="19" rx="0" ry="0" fill="#0F0F0F"/>
  <rect x="1" y="198" width="778" height="21" rx="10" ry="10" fill="#0F0F0F"/>
  <!-- Subtle inner top glow under title bar -->
  <rect x="1" y="37" width="778" height="2" fill="#A4133C" opacity="0.08"/>

  <!-- ── SCANLINE OVERLAY (subtle) ──────────────── -->
  <!-- Very faint horizontal lines every 4px to simulate CRT -->
  <rect x="1" y="37" width="778" height="182" fill="url(#scanlines)" opacity="0.03"/>

  <!-- ── TEXT CONTENT ────────────────────────────── -->
  <!--
    Font: Courier New monospace, 13px
    Line height: 22px
    Prompt start x: 22, y start: 68
  -->

  <!-- LINE 1: prompt + command -->
  <text font-family="'Courier New', 'Lucida Console', monospace" font-size="13"
        filter="url(#pglow)" opacity="0">
    <tspan x="22" y="68" fill="#A4133C">▶ guest@node</tspan><tspan fill="#C9184A">:</tspan><tspan fill="#FF4D6D">~</tspan><tspan fill="#C9184A">$</tspan><tspan fill="#D4D4D4"> cat /etc/profile.adam</tspan>
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.2s" fill="freeze" repeatCount="1"/>
  </text>

  <!-- Separator line -->
  <line x1="22" y1="80" x2="758" y2="80" stroke="#A4133C" stroke-width="0.5" opacity="0">
    <animate attributeName="opacity" values="0;0.25" dur="0.3s" begin="0.5s" fill="freeze" repeatCount="1"/>
  </line>

  <!-- LINE 2: ORIGIN -->
  <text font-family="'Courier New', 'Lucida Console', monospace" font-size="13" opacity="0">
    <tspan x="40" y="100" fill="#C9184A" font-weight="bold">ORIGIN  </tspan><tspan fill="#666666">: </tspan><tspan fill="#D4D4D4">1337 Bootcamp — low-level C / SysAdmin</tspan>
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.6s" fill="freeze" repeatCount="1"/>
  </text>

  <!-- LINE 3: CURRENT -->
  <text font-family="'Courier New', 'Lucida Console', monospace" font-size="13" opacity="0">
    <tspan x="40" y="122" fill="#C9184A" font-weight="bold">CURRENT </tspan><tspan fill="#666666">: </tspan><tspan fill="#D4D4D4">YouCode UM6P</tspan>
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.0s" fill="freeze" repeatCount="1"/>
  </text>

  <!-- LINE 4: ROLE -->
  <text font-family="'Courier New', 'Lucida Console', monospace" font-size="13" opacity="0">
    <tspan x="40" y="144" fill="#C9184A" font-weight="bold">ROLE    </tspan><tspan fill="#666666">: </tspan><tspan fill="#D4D4D4">Full Stack &amp; AI Developer</tspan>
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.4s" fill="freeze" repeatCount="1"/>
  </text>

  <!-- LINE 5: NOW -->
  <text font-family="'Courier New', 'Lucida Console', monospace" font-size="13" opacity="0">
    <tspan x="40" y="166" fill="#C9184A" font-weight="bold">NOW  →  </tspan><tspan fill="#666666">: </tspan><tspan fill="#D4D4D4">AI Integration</tspan>
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.8s" fill="freeze" repeatCount="1"/>
  </text>

  <!-- Separator line 2 -->
  <line x1="22" y1="178" x2="758" y2="178" stroke="#A4133C" stroke-width="0.5" opacity="0">
    <animate attributeName="opacity" values="0;0.25" dur="0.3s" begin="2.0s" fill="freeze" repeatCount="1"/>
  </line>

  <!-- LINE 6: idle prompt -->
  <text font-family="'Courier New', 'Lucida Console', monospace" font-size="13"
        filter="url(#pglow)" opacity="0">
    <tspan x="22" y="198" fill="#A4133C">▶ guest@node</tspan><tspan fill="#C9184A">:</tspan><tspan fill="#FF4D6D">~</tspan><tspan fill="#C9184A">$</tspan>
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="2.2s" fill="freeze" repeatCount="1"/>
  </text>

  <!-- Blinking cursor block — crisp discrete blink, positioned after '$ ' -->
  <text x="148" y="198" font-family="'Courier New', 'Lucida Console', monospace"
        font-size="13" fill="#FF4D6D" filter="url(#pglow)" opacity="0">█
    <!-- Appear after idle prompt fades in -->
    <animate attributeName="opacity" values="0;1" dur="0.05s" begin="2.4s" fill="freeze" repeatCount="1"/>
    <!-- Crisp on/off blink — no easing, hard cut like a real terminal -->
    <animate attributeName="opacity" values="1;1;0;0;1" dur="0.9s" begin="2.5s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.45;0.5;0.95;1"/>
  </text>

</svg>
