<svg xmlns="http://www.w3.org/2000/svg" width="800" height="60" viewBox="0 0 800 60" role="img" aria-label="Footer loading bar">
  <title>Footer bar</title>

  <defs>
    <!-- Same crimson gradient as hero, spans full block row -->
    <linearGradient id="g" x1="18" y1="0" x2="782" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#A4133C"/>
      <stop offset="50%"  stop-color="#C9184A"/>
      <stop offset="100%" stop-color="#FF4D6D"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="glow" x="-10%" y="-100%" width="120%" height="400%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Clip scanner to bar zone -->
    <clipPath id="clip">
      <rect x="18" y="21" width="764" height="18"/>
    </clipPath>
  </defs>

  <!--
    30 blocks to fill 800px: width=18, gap=8, step=26
    Total = 30*18 + 29*8 = 540 + 232 = 772px → start x=14, end x=786
    Adjusted: step=26, start=18, 30 blocks → last x = 18 + 29*26 = 18+754 = 772, end=790
  -->

  <g filter="url(#glow)">
    <!-- LEFT FADE (blocks 0–5) -->
    <rect x="18"  y="21" width="18" height="18" rx="2" fill="url(#g)" opacity="0.05"><animate attributeName="opacity" values="0.05;0.9;0.05" dur="2.6s" begin="0.00s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/></rect>
    <rect x="44"  y="21" width="18" height="18" rx="2" fill="url(#g)" opacity="0.12"><animate attributeName="opacity" values="0.12;0.95;0.12" dur="2.6s" begin="0.09s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/></rect>
    <rect x="70"  y="21" width="18" height="18" rx="2" fill="url(#g)" opacity="0.25"><animate attributeName="opacity" values="0.25;1;0.25" dur="2.6s" begin="0.18s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/></rect>
    <rect x="96"  y="21" width="18" height="18" rx="2" fill="url(#g)" opacity="0.42"><animate attributeName="opacity" values="0.42;1;0.42" dur="2.6s" begin="0.27s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/></rect>
    <rect x="122" y="21" width="18" height="18" rx="2" fill="url(#g)" opacity="0.62"><animate attributeName="opacity" values="0.62;1;0.62" dur="2.6s" begin="0.36s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/></rect>
    <rect x="148" y="21" width="18" height="18" rx="2" fill="url(#g)" opacity="0.80"><animate attributeName="opacity" values="0.80;1;0.80" dur="2.6s" begin="0.45s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/></rect>

    <!-- SOLID CENTER (blocks 6–23) -->
    <rect x="174" y="21" width="18" height="18" rx="2" fill="url(#g)" opacity="1"><animate attributeName="opacity" values="0.60;1;0.60" dur="2.6s" begin="0.54s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/></rect>
    <rect x="200" y="21" width="18" height="18" rx="2" fill="url(#g)" opacity="1"><animate attributeName="opacity" values="0.60;1;0.60" dur="2.6s" begin="0.63s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/></rect>
    <rect x="226" y="21" width="18" height="18" rx="2" fill="url(#g)" opacity="1"><animate attributeName="opacity" values="0.60;1;0.60" dur="2.6s" begin="0.72s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/></rect>
    <rect x="252" y="21" width="18" height="18" rx="2" fill="url(#g)" opacity="1"><animate attributeName="opacity" values="0.60;1;0.60" dur="2.6s" begin="0.81s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/></rect>
    <rect x="278" y="21" width="18" height="18" rx="2" fill="url(#g)" opacity="1"><animate attributeName="opacity" values="0.60;1;0.60" dur="2.6s" begin="0.90s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/></rect>
    <rect x="304" y="21" width="18" height="18" rx="2" fill="url(#g)" opacity="1"><animate attributeName="opacity" values="0.60;1;0.60" dur="2.6s" begin="0.99s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/></rect>
    <rect x="330" y="21" width="18" height="18" rx="2" fill="url(#g)" opacity="1"><animate attributeName="opacity" values="0.60;1;0.60" dur="2.6s" begin="1.08s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/></rect>
    <rect x="356" y="21" width="18" height="18" rx="2" fill="url(#g)" opacity="1"><animate attributeName="opacity" values="0.60;1;0.60" dur="2.6s" begin="1.17s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/></rect>
    <rect x="382" y="21" width="18" height="18" rx="2" fill="url(#g)" opacity="1"><animate attributeName="opacity" values="0.60;1;0.60" dur="2.6s" begin="1.26s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/></rect>
    <rect x="408" y="21" width="18" height="18" rx="2" fill="url(#g)" opacity="1"><animate attributeName="opacity" values="0.60;1;0.60" dur="2.6s" begin="1.35s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/></rect>
    <rect x="434" y="21" width="18" height="18" rx="2" fill="url(#g)" opacity="1"><animate attributeName="opacity" values="0.60;1;0.60" dur="2.6s" begin="1.44s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/></rect>
    <rect x="460" y="21" width="18" height="18" rx="2" fill="url(#g)" opacity="1"><animate attributeName="opacity" values="0.60;1;0.60" dur="2.6s" begin="1.53s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/></rect>
    <rect x="486" y="21" width="18" height="18" rx="2" fill="url(#g)" opacity="1"><animate attributeName="opacity" values="0.60;1;0.60" dur="2.6s" begin="1.62s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/></rect>
    <rect x="512" y="21" width="18" height="18" rx="2" fill="url(#g)" opacity="1"><animate attributeName="opacity" values="0.60;1;0.60" dur="2.6s" begin="1.71s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/></rect>
    <rect x="538" y="21" width="18" height="18" rx="2" fill="url(#g)" opacity="1"><animate attributeName="opacity" values="0.60;1;0.60" dur="2.6s" begin="1.80s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/></rect>
    <rect x="564" y="21" width="18" height="18" rx="2" fill="url(#g)" opacity="1"><animate attributeName="opacity" values="0.60;1;0.60" dur="2.6s" begin="1.89s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/></rect>
    <rect x="590" y="21" width="18" height="18" rx="2" fill="url(#g)" opacity="1"><animate attributeName="opacity" values="0.60;1;0.60" dur="2.6s" begin="1.98s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/></rect>
    <rect x="616" y="21" width="18" height="18" rx="2" fill="url(#g)" opacity="1"><animate attributeName="opacity" values="0.60;1;0.60" dur="2.6s" begin="2.07s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/></rect>

    <!-- RIGHT FADE (blocks 24–29) -->
    <rect x="642" y="21" width="18" height="18" rx="2" fill="url(#g)" opacity="0.80"><animate attributeName="opacity" values="0.80;1;0.80" dur="2.6s" begin="2.16s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/></rect>
    <rect x="668" y="21" width="18" height="18" rx="2" fill="url(#g)" opacity="0.62"><animate attributeName="opacity" values="0.62;1;0.62" dur="2.6s" begin="2.25s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/></rect>
    <rect x="694" y="21" width="18" height="18" rx="2" fill="url(#g)" opacity="0.42"><animate attributeName="opacity" values="0.42;1;0.42" dur="2.6s" begin="2.34s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/></rect>
    <rect x="720" y="21" width="18" height="18" rx="2" fill="url(#g)" opacity="0.25"><animate attributeName="opacity" values="0.25;1;0.25" dur="2.6s" begin="2.43s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/></rect>
    <rect x="746" y="21" width="18" height="18" rx="2" fill="url(#g)" opacity="0.12"><animate attributeName="opacity" values="0.12;0.95;0.12" dur="2.6s" begin="2.52s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/></rect>
    <rect x="772" y="21" width="18" height="18" rx="2" fill="url(#g)" opacity="0.05"><animate attributeName="opacity" values="0.05;0.9;0.05" dur="2.6s" begin="2.61s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/></rect>
  </g>

  <!-- Scanner sweep -->
  <g clip-path="url(#clip)">
    <rect x="-4" y="21" width="24" height="18" rx="2" fill="white" opacity="0">
      <animate attributeName="opacity" values="0;0.20;0" dur="2.6s" begin="0s" repeatCount="indefinite" keyTimes="0;0.08;0.92" calcMode="spline" keySplines="0 0 1 1;0 0 1 1"/>
      <animateTransform attributeName="transform" type="translate" from="22 0" to="790 0" dur="2.6s" begin="0s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
